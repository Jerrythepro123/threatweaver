[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vvaharness"
version = "1.0.0"
description = "Visa's open-source harness for autonomous vulnerability discovery and validation, using frontier AI models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3",
    "anthropic>=0.107.0",
    "openai>=2.41.0",
    "httpx>=0.28.1",
    "urllib3>=2.7.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# Dev tooling: `pip install '.[dev]'` to run the test suite + the static
# undefined-name gate (pyflakes).
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
vvaharness = "vvaharness.cli:main"

[tool.setuptools.packages.find]
include = ["vvaharness*"]

[tool.setuptools.package-data]
vvaharness = ["config/profiles/*.yaml"]
